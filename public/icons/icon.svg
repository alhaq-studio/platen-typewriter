<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#070605" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5c378" />
      <stop offset="50%" stop-color="#c5a059" />
      <stop offset="100%" stop-color="#8a6729" />
    </linearGradient>
    <filter id="goldShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#2b2723" stroke-width="6" />

  <!-- Outer Key Rim -->
  <circle cx="256" cy="256" r="180" fill="#141210" stroke="url(#goldGrad)" stroke-width="12" filter="url(#goldShadow)" />
  <circle cx="256" cy="256" r="160" fill="#0d0c0a" stroke="#2b2723" stroke-width="4" />

  <!-- Mechanical Letter 'P' -->
  <text x="256" y="325" font-family="'Cormorant Garamond', 'Georgia', serif" font-size="220" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2">P</text>

  <!-- Typewriter Carriage Sub-Emblem -->
  <rect x="206" y="365" width="100" height="4" rx="2" fill="#c5a059" opacity="0.6" />
</svg>
